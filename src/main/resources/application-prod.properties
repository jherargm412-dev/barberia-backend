# Perfil de producción (Railway). Las credenciales y secretos llegan por variables de entorno.

# Railway asigna el puerto en la variable PORT.
server.port=${PORT:8080}

spring.jpa.show-sql=false

# Duración de sesión acordada por el equipo: 8 horas (05 §5.3).
app.security.jwt.expiracion-segundos=28800

# Plan Free de Railway: 0,5 GB de RAM por servicio. Pocas conexiones bastan para la barbería.
spring.datasource.hikari.maximum-pool-size=5
