spring.application.name=backend
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Base de datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barber}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo gestiona Flyway (src/main/resources/db/migration). Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Seguridad (JWT). El secreto SOLO por variable de entorno (>= 32 caracteres, HS256).
app.security.jwt.secreto=${JWT_SECRET}
# app.security.jwt.expiracion-segundos: obligatoria, sin default. Se define por perfil
# (ver application-dev.properties) hasta que el equipo fije la duración de sesión [PENDIENTE].
app.security.bcrypt.fuerza=12

# CU02 (05 §5.2): tras N contraseñas incorrectas seguidas, la cuenta se bloquea M minutos.
app.security.login.max-intentos=3
app.security.login.bloqueo-minutos=30

# Correo saliente (Gmail del proyecto). MAIL_USERNAME y MAIL_PASSWORD van en backend/.env.
# MAIL_PASSWORD es una "contraseña de aplicación" de Google (16 letras, sin espacios).
# Si MAIL_USERNAME está vacío, los correos no se envían: se escriben en el log (solo para desarrollo).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.correo.remitente-nombre=House of Cut

# Recuperar contraseña: código de 6 dígitos que dura N minutos y admite M intentos.
# Más de S solicitudes en V minutos bloquean nuevas solicitudes hasta que pase la ventana.
app.recuperacion.vigencia-minutos=5
app.recuperacion.max-intentos=3
app.recuperacion.max-solicitudes=3
app.recuperacion.ventana-minutos=30

# Invitación por correo a trabajadores: el enlace apunta al frontend y dura N horas.
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.invitacion.vigencia-horas=48

# Administrador semilla (solo se usa si no existe ningún usuario con rol Administrador)
app.seed.admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed.admin.password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.admin.nombre=${APP_SEED_ADMIN_NOMBRE:Administrador}

# CORS (origen del frontend). Varios orígenes separados por coma.
app.cors.origenes=${CORS_ORIGIN:http://localhost:5173}

# Actuator: solo se expone /actuator/health (Railway lo consulta para saber si el backend está vivo).
management.endpoints.web.exposure.include=health
# El correo no entra en el health: en Railway el SMTP está bloqueado y marcaría el backend como caído.
management.health.mail.enabled=false
