# Pruebas de integración contra el PostgreSQL local, en un esquema AISLADO (cu_test).
# Flyway limpia y migra SOLO el esquema cu_test al iniciar el contexto; nunca toca "public".
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/barber?currentSchema=cu_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.schemas=cu_test
spring.flyway.default-schema=cu_test
spring.flyway.clean-disabled=false
spring.jpa.properties.hibernate.default_schema=cu_test
spring.jpa.show-sql=false

app.security.jwt.secreto=secreto_de_pruebas_house_of_cut_minimo_32_chars
app.security.jwt.expiracion-segundos=3600
# BCrypt más rápido en pruebas (en ejecución normal es 12).
app.security.bcrypt.fuerza=4

app.seed.admin.email=admin.pruebas@houseofcut.bo
app.seed.admin.password=AdminPruebas123
app.seed.admin.nombre=Admin Pruebas

app.cors.origenes=http://localhost:5173
