plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Carga backend/.env como variables de entorno al ejecutar `./gradlew bootRun` y `./gradlew test`.
// Spring Boot no lee archivos .env por sí mismo.
// En test solo se pasan las credenciales de BD: el resto (JWT, admin semilla...) lo fija
// application-test.properties y una variable de entorno lo sobrescribiría.
def cargarEnv = { task, soloBd ->
	def envFile = file('.env')
	if (envFile.exists()) {
		envFile.readLines().each { line ->
			def limpia = line.trim()
			if (limpia && !limpia.startsWith('#') && limpia.contains('=')) {
				def idx = limpia.indexOf('=')
				def clave = limpia.substring(0, idx).trim()
				if (!soloBd || clave.startsWith('DB_') || clave.startsWith('TEST_DB_')) {
					task.environment clave, limpia.substring(idx + 1).trim()
				}
			}
		}
	}
}

tasks.named('bootRun') { cargarEnv(it, false) }
tasks.named('test') { cargarEnv(it, true) }
