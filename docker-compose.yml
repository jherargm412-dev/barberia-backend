# Prueba local del despliegue: PostgreSQL + backend en perfil prod, igual que en Railway.
#   docker compose up --build      (levantar)
#   docker compose down -v         (apagar y borrar la base de prueba)
# JWT_SECRET y APP_SEED_ADMIN_* se toman de backend/.env. Usa una base propia (no toca tu PostgreSQL local).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barber"]
      interval: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Mismo límite de memoria que el plan Free de Railway.
    mem_limit: 512m
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/barber
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en backend/.env}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL:?Falta APP_SEED_ADMIN_EMAIL en backend/.env}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:?Falta APP_SEED_ADMIN_PASSWORD en backend/.env}
      APP_SEED_ADMIN_NOMBRE: ${APP_SEED_ADMIN_NOMBRE:-Administrador}
      # Correo: por defecto se escribe en el log. Para enviar de verdad, como en Railway:
      #   APP_CORREO_PROVEEDOR=brevo docker compose up --build   (usa BREVO_API_KEY y MAIL_FROM de backend/.env)
      MAIL_USERNAME: ""
      APP_CORREO_PROVEEDOR: ${APP_CORREO_PROVEEDOR:-smtp}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Frontend local en Docker (ver README del frontend).
      CORS_ORIGIN: http://localhost:8081
      APP_FRONTEND_URL: http://localhost:8081

volumes:
  datos:
